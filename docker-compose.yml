# Dev/prod composition. The frontends build to static files served by nginx;
# the backend and Postgres run as services. Build the apps with `pnpm build`
# and mount their dist/ folders into /srv/<portal> (or copy in a Dockerfile).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: menaml_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/menaml_dev
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      COOKIE_DOMAIN: .mena.ml
      NODE_ENV: production
    depends_on:
      - db
    ports:
      - "3000:3000"

  proxy:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/apps/organizer/dist:/srv/organizer:ro
      - ./frontend/apps/travel-agency/dist:/srv/travel-agency:ro
      - ./frontend/apps/sponsor/dist:/srv/sponsor:ro
      - ./frontend/apps/reviewer/dist:/srv/reviewer:ro
      - ./frontend/apps/participant/dist:/srv/participant:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
