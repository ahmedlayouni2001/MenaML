# MenaML reverse proxy — subdomain routing.
# Each portal's built static files are served from /srv/<portal>;
# all /api traffic goes to the shared backend.

upstream mena_api { server backend:3000; }

# Shared API
server {
  listen 80;
  server_name api.mena.ml;
  location / {
    proxy_pass http://mena_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Portal SPAs — one block each. try_files falls back to index.html for client routing.
server { listen 80; server_name organizer.mena.ml;   root /srv/organizer;     location / { try_files $uri /index.html; } }
server { listen 80; server_name agency.mena.ml;      root /srv/travel-agency; location / { try_files $uri /index.html; } }
server { listen 80; server_name sponsor.mena.ml;     root /srv/sponsor;       location / { try_files $uri /index.html; } }
server { listen 80; server_name reviewer.mena.ml;    root /srv/reviewer;      location / { try_files $uri /index.html; } }
server { listen 80; server_name participant.mena.ml; root /srv/participant;   location / { try_files $uri /index.html; } }
